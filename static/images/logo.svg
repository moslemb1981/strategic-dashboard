<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 249 255" width="249" height="255">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123258"/>
      <stop offset="100%" stop-color="#0E9B96"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F6C667"/>
      <stop offset="100%" stop-color="#EEA93B"/>
    </linearGradient>
  </defs>

  <rect x="6" y="6" width="237" height="243" rx="54" fill="url(#badgeGrad)"/>

  <!-- ascending bars (bar-chart motif) -->
  <rect x="44" y="150" width="34" height="46" rx="8" fill="#FFFFFF" fill-opacity="0.92"/>
  <rect x="92" y="118" width="34" height="78" rx="8" fill="#FFFFFF" fill-opacity="0.92"/>
  <rect x="140" y="80"  width="34" height="116" rx="8" fill="#FFFFFF" fill-opacity="0.92"/>

  <!-- upward trend arrow -->
  <line x1="38" y1="190" x2="182" y2="70.6" stroke="url(#arrowGrad)" stroke-width="12" stroke-linecap="round"/>
  <polygon points="202,54 185.9,81.6 171.9,64.7" fill="url(#arrowGrad)"/>
</svg>
